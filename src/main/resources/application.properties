spring.application.name=habitsapi
# This username and password are used only when someone calls /api/auth/login.
habitsapi.security.username=${HABITS_API_USERNAME}
habitsapi.security.password=${HABITS_API_PASSWORD}
# The token says who created it, and the API checks that name before accepting it.
habitsapi.security.jwt-issuer=habitsapi
# These connect to your existing MySQL database; set the values in your environment.
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
